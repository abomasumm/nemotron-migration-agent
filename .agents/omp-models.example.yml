# Oh My Pi provider for 9router. Merge into ~/.omp/agent/models.yml, then check: omp models 9router
# Field names follow omp's docs/models.md. Model ids must match what 9router exposes (ocg/ = Go, cmc/ = GOAT).
# DeepSeek entries carry the compat block DeepSeek documents for omp: without it, long thinking-mode
# sessions with tool calls return 400. VERIFY that 9router passes reasoning_content through.
providers:
  9router:
    baseUrl: http://127.0.0.1:20128/v1
    api: openai-completions
    apiKey: NINEROUTER_API_KEY        # name of the env var holding your 9router key
    authHeader: true
    models:
      # ---------- OpenCode Go (ocg/) ----------
      - id: ocg/deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash (Go)
        reasoning: true
        thinking: { minLevel: high, maxLevel: xhigh, mode: effort }
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        compat: &deepseek
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          reasoningEffortMap: { high: high, xhigh: max }
          supportsToolChoice: false
          requiresReasoningContentForToolCalls: true
          requiresAssistantContentForToolCalls: true
          extraBody: { thinking: { type: enabled } }
      - id: ocg/muse-spark-1.3-contributor
        name: Muse Spark 1.3 Contributor (Go)
        reasoning: true
        thinking: { maxLevel: xhigh, mode: effort }   # Go rejects max for Muse
        input: [text]
        contextWindow: 1000000
        compat: { supportsReasoningEffort: true }
      - id: ocg/mimo-v2.6-pro
        name: MiMo V2.6 Pro (Go)
        reasoning: true
        input: [text]
        contextWindow: 1000000
      - id: ocg/mimo-v2.6-flash
        name: MiMo V2.6 Flash (Go)
        input: [text]
        contextWindow: 1000000
      - id: ocg/glm-5.3-flash
        name: GLM-5.3 Flash (Go)
        reasoning: true
        input: [text, image]
      - id: ocg/kimi-k3
        name: Kimi K3 (Go)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
      - id: ocg/space-bunny-free
        name: Space Bunny Free (Go)
        input: [text]
      # ---------- Command Code GOAT (cmc/) ----------
      - id: cmc/gpt-5.6-sol
        name: GPT-5.6 Sol (GOAT)
        reasoning: true
        thinking: { maxLevel: xhigh, mode: effort }
        input: [text, image]
        compat: { supportsReasoningEffort: true }
      - id: cmc/kimi-k3
        name: Kimi K3 (GOAT)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
      - id: cmc/gemini-3.8-flash
        name: Gemini 3.8 Flash (GOAT)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
      - id: cmc/deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash (GOAT)
        reasoning: true
        thinking: { minLevel: high, maxLevel: xhigh, mode: effort }
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        compat: *deepseek
      - id: cmc/muse-spark-1.3-contributor
        name: Muse Spark 1.3 Contributor (GOAT)
        reasoning: true
        thinking: { maxLevel: xhigh, mode: effort }
        input: [text]
        contextWindow: 1000000
        compat: { supportsReasoningEffort: true }
      - id: cmc/mimo-v2.6-pro
        name: MiMo V2.6 Pro (GOAT)
        reasoning: true
        input: [text]
      - id: cmc/mimo-v2.6-flash
        name: MiMo V2.6 Flash (GOAT)
        input: [text]
      - id: cmc/glm-5.3-flash
        name: GLM-5.3 Flash (GOAT)
        reasoning: true
        input: [text, image]
  # Optional: OpenCode Free through 9router (last-resort fallback for status notes and repo maps).
  # Model ids come and go; the kit uses oc/auto.
